services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: urlshortener
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
