# Overlay: always use alongside the EXISTING docker-compose.yml and compose.redis.yml.
# This intentionally does not redefine db/redis or their volumes.
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    command: ["python", "docker/wait_for_services.py", "python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    command: ["python", "docker/wait_for_services.py", "python", "-m", "app.worker"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
